# 服务器端口配置
server.port=8080

# 数据库连接配置（使用嵌入式H2数据库）
spring.datasource.url=jdbc:h2:mem:traffic_system;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA (Java Persistence API) 配置
# 让Hibernate根据实体类自动更新数据库表结构
spring.jpa.hibernate.ddl-auto=update
# 在日志中显示执行的SQL语句，便于调试
spring.jpa.show-sql=true
# 配置JPA数据库平台为H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2控制台配置
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT (JSON Web Token) 配置
# 用于签发和验证Token的密钥，请务必修改为一个更复杂的字符串
jwt.secret=YourSuperSecretKeyForJWTGeneration
# Token的过期时间（毫秒），此处设置为1小时
jwt.expiration=3600000

# ---------- 本地 OSRM（重庆 .osm.pbf 路网）----------
# 使用「启动全栈后端.cmd」会新开 OSRM 窗口并保持；若注释本行，后端主要走公网 OSRM（慢且不稳定）
# 若 5000 被占用，启动脚本会改用 5001 等并写入 data/osrm-published-endpoint.txt；用 后端-启动.cmd 时会自动设环境变量 ROUTING_OSRM_LOCAL_BASE_URL 覆盖此处。
routing.osrm.local-base-url=http://127.0.0.1:5000