<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 智慧交通全域信号管控系统</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: sans-serif; background-color: #1a1a1a; color: #e0e0e0; display: flex; align-items: center; justify-content: center; }
        .login-container { background-color: #2c2c2c; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 320px; text-align: center; }
        h2 { margin-bottom: 20px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 5px; color: #aaa; }
        input { width: 100%; padding: 10px; background: #333; border: 1px solid #444; border-radius: 4px; color: #e0e0e0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        .error-message { color: #ff4d4f; margin-top: 15px; height: 20px; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>系统登录</h2>
        <div class="input-group">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" value="police" required>
        </div>
        <div class="input-group">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" value="12345" required>
        </div>
        <button onclick="login()">登 录</button>
        <p style="margin-top:16px;font-size:13px;"><a href="dev_hub.html" style="color:#58a6ff;">开发者枢纽（唯一联调界面 · 选功能驱动内嵌终端）</a></p>
        <div id="error-msg" class="error-message"></div>
    </div>

    <script>
    async function login() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('error-msg');
        errorMsg.textContent = '';

        try {
            const response = await fetch('http://localhost:8080/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ username, password }),
            });

            if (response.ok) {
                const data = await response.json();
                localStorage.setItem('jwtToken', data.token);
                localStorage.setItem('userRole', data.role);

                // 本项目仅保留警用终端；其它角色也进入警用端
                if (data.role === 'police' || data.role === 'gov' || data.role === 'vehicle') {
                    window.location.href = 'police_terminal.html';
                } else {
                    errorMsg.textContent = '未知的用户角色!';
                }
            } else {
                errorMsg.textContent = '用户名或密码错误!';
            }
        } catch (error) {
            console.error('登录请求失败:', error);
            errorMsg.textContent = '无法连接到服务器!';
        }
    }
    </script>
</body>
</html>
